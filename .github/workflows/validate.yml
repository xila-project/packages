name: Validate package registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and generate a static preview
    runs-on: ubuntu-latest
    steps:
      - name: "Setup | Checkout registry"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: "Setup | Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Test | Registry unit tests"
        run: python -m unittest discover -s tests -v
      - name: "Validate | Package manifests"
        run: python tools/registry.py validate
      - name: "Build | Registry preview"
        run: python tools/registry.py build
      - name: "Report | Upload registry preview"
        uses: actions/upload-artifact@v4
        with:
          name: static-package-registry-preview
          path: _site/
          if-no-files-found: error
