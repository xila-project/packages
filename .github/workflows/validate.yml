name: Validate package registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and generate a static preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Setup | Checkout registry"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Setup | Cache xila-package"
        uses: actions/cache@v4
        with:
          path: .tools
          key: xila-package-${{ hashFiles('tools/xila-package.sh') }}
      - name: "Validate | Keys, entries and archives"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            bash tools/validate.sh "origin/$BASE_REF"
          else
            bash tools/validate.sh
          fi
      - name: "Report | Upload registry site"
        uses: actions/upload-artifact@v4
        with:
          name: registry-site
          path: _site/
          if-no-files-found: error

  required:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          VALIDATE: ${{ needs.validate.result }}
        run: test "$VALIDATE" = success
