name: Validate package registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and generate a static preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate package declarations
        run: python tools/registry.py validate
      - name: Generate registry preview
        run: python tools/registry.py build
      - name: Upload generated preview for review
        uses: actions/upload-artifact@v4
        with:
          name: static-package-registry-preview
          path: _site/
          if-no-files-found: error
