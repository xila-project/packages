name: Publish static package registry preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish unsigned metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: "Setup | Checkout approved main"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: "Setup | Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Test | Registry publishing code"
        run: python -m unittest discover -s tests -v
      - name: "Build | Registry metadata"
        run: python tools/registry.py build
      - name: "Publish | Configure Pages"
        uses: actions/configure-pages@v5
      - name: "Publish | Upload registry site"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: "Publish | Deploy Pages"
        uses: actions/deploy-pages@v4
