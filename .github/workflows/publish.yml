name: Publish package registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish registry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: "Setup | Checkout approved main"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: "Setup | Cache xila-package"
        uses: actions/cache@v4
        with:
          path: .tools
          key: xila-package-${{ hashFiles('tools/validate.sh') }}
      - name: "Validate | Keys, entries and archives"
        run: bash tools/validate.sh
      - name: "Publish | Configure Pages"
        uses: actions/configure-pages@v5
      - name: "Publish | Upload registry site"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: "Publish | Deploy Pages"
        uses: actions/deploy-pages@v4
