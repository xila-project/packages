name: Publish static package registry preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish unsigned metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate publishing code
        run: python -m unittest discover -s tests -v
      - name: Build metadata
        run: python tools/registry.py build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload published site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
